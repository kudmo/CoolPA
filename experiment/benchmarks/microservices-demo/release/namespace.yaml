apiVersion: v1
kind: Namespace
metadata:
  name: microservices-demo
---
apiVersion: v1
kind: LimitRange
metadata:
  name: microservices-demo-limits
  namespace: microservices-demo
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    max:
      cpu: 3
      memory: 6Gi
    min:
      cpu: 5m
      memory: 32Mi
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: microservices-demo-quota
  namespace: microservices-demo
  labels:
    environment: development
    team: microservices-team
  annotations:
    description: "Resource quota for microservices-demo namespace"
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "12Gi"
    limits.cpu: "24"
    limits.memory: "32Gi"
    pods: "50"
    requests.storage: "20Gi"
