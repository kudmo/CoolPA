apiVersion: v1
kind: Namespace
metadata:
  name: microservices-demo
---
apiVersion: v1
kind: LimitRange
metadata:
  name: microservices-demo-limits
  namespace: microservices-demo
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    max:
      cpu: 2
      memory: 2Gi
    min:
      cpu: 5m
      memory: 32Mi
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: microservices-demo-quota
  namespace: microservices-demo
  labels:
    environment: development
    team: microservices-team
  annotations:
    description: "Resource quota for microservices-demo namespace"
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "12"
    limits.memory: "16Gi"
    
    pods: "50"
    
    requests.storage: "20Gi"
