apiVersion: v1
kind: ConfigMap
metadata:
  name: scaler-config
  namespace: autoscale-test
data:
  config.yaml: |
    scaling_namespace: "microservices-demo"
    prometheus_url: "http://prometheus.monitoring.svc.cluster.local:9090"
    prometheus_interval: 5s
    analyzer_interval: 15s
    slo: 100
    scaling_cooldown: 300s
    logger:
      level: "info"
      format: "text"
