name: License Compliance Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'smartautoscaler/go.mod'
      - 'smartautoscaler/go.sum'
      - 'smartautoscaler/**/*.go'
      - '.github/workflows/*.yml'

jobs:
  license-check:
    name: Check License Compatibility
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: smartautoscaler/go.sum

    - name: Install go-licenses
      run: |
        go install github.com/google/go-licenses@latest

    - name: Check licenses against Apache 2.0
      working-directory: smartautoscaler
      run: |
        go-licenses check ./... \
          --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0 \
          --disallowed_licenses=GPL-2.0,GPL-3.0,AGPL-3.0,LGPL-2.1,LGPL-3.0

    - name: Generate license report
      working-directory: smartautoscaler
      run: |
        mkdir -p license-report
        go-licenses csv ./... > license-report/licenses.csv
        go-licenses report ./... > license-report/licenses-report.txt
        
        cat license-report/licenses-report.txt

    - name: Upload license report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: smartautoscaler/license-report/

    - name: Comment license issues on PR
      if: failure()
      run: |
        echo "License compliance check failed. Please review the license report."
        echo "Allowed licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, MIT, ISC, MPL-2.0"
        echo "Disallowed licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0"
        exit 1