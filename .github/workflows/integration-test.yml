name: Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'smartautoscaler/**'
      - 'experiments/**'
      - '.github/workflows/*.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: smartautoscaler/go.sum

    - name: Build and test smartautoscaler
      working-directory: smartautoscaler
      run: |
        go build ./...
        go vet ./...
        go test ./... -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make scaler-build AUTOSCALER_IMAGE=smartautoscaler:test
      env:
        SCALER_APP_DIR: ../../../../smartautoscaler

    - name: Set up Kind cluster
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: ms-demo
        node_image: kindest/node:v1.28.0
        wait: 120s

    - name: Install Istio
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.20.3 sh -
        export PATH="$PWD/istio-1.20.3/bin:$PATH"
        make istio-install

    - name: Deploy monitoring
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make deploy-monitoring

    - name: Deploy demo application
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make deploy-demo

    - name: Wait for demo pods
      run: |
        kubectl --context=kind-ms-demo wait --for=condition=ready pod --all -n microservices-demo --timeout=300s

    - name: Load smartautoscaler image to Kind
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make scaler-kind-load AUTOSCALER_IMAGE=smartautoscaler:test

    - name: Deploy smartautoscaler
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make deploy-scaler AUTOSCALER_IMAGE=smartautoscaler:test
      env:
        SCALER_APP_DIR: ../../../../smartautoscaler

    - name: Wait for smartautoscaler pod
      run: |
        kubectl --context=kind-ms-demo wait --for=condition=ready pod -l app=smartautoscaler -n autoscale-test --timeout=120s

    - name: Check smartautoscaler logs
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make scaler-logs

    - name: Test basic functionality
      run: |
        POD_NAME=$(kubectl --context=kind-ms-demo get pods -l app=smartautoscaler -n autoscale-test -o jsonpath='{.items[0].metadata.name}')
        kubectl --context=kind-ms-demo exec $POD_NAME -n autoscale-test -- ls -la /app/
        
        kubectl --context=kind-ms-demo exec $POD_NAME -n autoscale-test -- cat /app/config.yaml
        
        kubectl --context=kind-ms-demo exec $POD_NAME -n autoscale-test -- ls -la /app/latency_model.onnx

    - name: Test scaling functionality (optional)
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make hpa-scale SERVICE=frontend REPLICAS=2
        sleep 10
        kubectl --context=kind-ms-demo get deployment frontend -n microservices-demo -o jsonpath='{.spec.replicas}'

    - name: Cleanup
      if: always()
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make cluster-down CLUSTER_NAME=ms-demo || true
