name: Integration Tests

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'smartautoscaler/**'
      - 'experiments/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: smartautoscaler/go.sum

    - name: Build smartautoscaler
      working-directory: smartautoscaler
      run: |
        go build ./...
        go vet ./...
        go test ./... -v

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: smartautoscaler
      run: |
        docker build -t smartautoscaler:test -f Dockerfile .

    - name: Set up Kind cluster
      uses: helm/kind-action@v1.10.0
      with:
        cluster_name: ms-demo
        node_image: kindest/node:v1.28.0
        wait: 120s

    - name: Install Istio
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        curl -L https://istio.io/downloadIstio | ISTIO_VERSION=1.20.3 sh -
        export PATH="$PWD/istio-1.20.3/bin:$PATH"
        make istio-install

    - name: Deploy monitoring
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make deploy-monitoring

    - name: Load smartautoscaler image to Kind
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        kind load docker-image smartautoscaler:test --name ms-demo

    - name: Deploy smartautoscaler
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        make deploy-scaler

    - name: Wait for smartautoscaler pod
      id: wait-pod
      continue-on-error: true
      run: |
        kubectl --context=kind-ms-demo wait --for=condition=ready pod -l app=smartautoscaler -n autoscale-test --timeout=300s

    - name: Debug smartautoscaler if pod not ready
      if: steps.wait-pod.outcome == 'failure'
      working-directory: experiment/benchmarks/OnlineBoutique
      run: |
        echo "=== Pod Status ==="
        kubectl --context=kind-ms-demo get pods -n autoscale-test -l app=smartautoscaler -o wide
        
        echo "=== Pod Description ==="
        kubectl --context=kind-ms-demo describe pod -l app=smartautoscaler -n autoscale-test
        
        echo "=== Pod Logs ==="
        kubectl --context=kind-ms-demo logs -l app=smartautoscaler -n autoscale-test --tail=100 || true
        
        echo "=== Previous Container Logs (if crash) ==="
        kubectl --context=kind-ms-demo logs -l app=smartautoscaler -n autoscale-test --previous --tail=100 || true
        
        echo "=== Events ==="
        kubectl --context=kind-ms-demo get events -n autoscale-test --sort-by='.lastTimestamp' | tail -20
        
        echo "=== Deployment Status ==="
        kubectl --context=kind-ms-demo describe deployment -l app=smartautoscaler -n autoscale-test
        
        echo "=== Image Details ==="
        kubectl --context=kind-ms-demo get pods -l app=smartautoscaler -n autoscale-test -o jsonpath='{.items[0].spec.containers[0].image}'
        
        exit 1

    - name: Check smartautoscaler logs
      run: |
        kubectl --context=kind-ms-demo logs -l app=smartautoscaler -n autoscale-test --tail=50

    - name: Cleanup
      if: always()
      run: |
        kind delete cluster --name ms-demo
