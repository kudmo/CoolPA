name: Golang tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'smartautoscaler/**'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  test-and-lint:
    name: Tests & Security
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./smartautoscaler
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: smartautoscaler/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files are not formatted. Run gofmt -w ."
            gofmt -l .
            exit 1
          fi
        shell: bash

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security vulnerability check
        run: govulncheck ./...
        continue-on-error: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './smartautoscaler'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run tests with coverage
        run: |
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
            go tool cover -func=coverage.out

      - name: Check coverage threshold (warning only)
        id: coverage_check
        run: |
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
            THRESHOLD=70
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::warning file=./smartautoscaler,line=1,title=Coverage threshold not met::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            echo "warning=true" >> $GITHUB_OUTPUT
            else
            echo "Coverage ${COVERAGE}% is above threshold ${THRESHOLD}%"
            echo "warning=false" >> $GITHUB_OUTPUT
            fi

      - name: Add coverage comment to PR
        if: steps.coverage_check.outputs.warning == 'true'
        uses: actions/github-script@v7
        with:
            script: |
                const coverage = '${{ steps.coverage_check.outputs.coverage }}';
                const threshold = 70;
                github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `## Coverage Warning\n\nCode coverage is ${coverage}% which is below the recommended threshold of ${threshold}%.\n\nPlease consider adding more tests to improve coverage.`
                });

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
            name: coverage-report
            path: smartautoscaler/coverage.out

      - name: Run staticcheck
        run: |
            go install honnef.co/go/tools/cmd/staticcheck@latest
            staticcheck ./...