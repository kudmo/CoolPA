apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: autoscale-test
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: test-go-app
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: test-go-app

      - job_name: smartautoscaler
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: smartautoscaler

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.kube-system.svc:8080

  rules.yml: |
    groups:
      - name: pbscaler
        interval: 5s
        rules:
          - record: app:rps
            expr: sum(rate(http_requests_total[1m]))

          - record: app:p95
            expr: histogram_quantile(
                    0.95,
                    sum by (le)(
                      rate(http_request_duration_seconds_bucket[1m])
                    )
                  )

          - record: app:pressure
            expr: app:rps * app:p95
