apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: autoscale-test
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Kubelet
      - job_name: 'kubelet'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      # Kubelet / node / pod metrics
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

      - job_name: 'autoscaled-apps'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - autoscale-test
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_autoscaling_enabled]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:8080
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['prometheus.autoscale-test.svc.cluster.local:9090']

      # Istio sidecar (Envoy proxy metrics)
      # Istio sidecar (Envoy proxy metrics)
      - job_name: 'istio-envoy'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: istio-proxy

          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:15090"

          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+)
            target_label: __tmp_port
            replacement: $1

          - source_labels: [__meta_kubernetes_pod_ip, __tmp_port]
            action: replace
            regex: (.+);(.+)
            target_label: __address__
            replacement: $1:$2
            # ВАЖНО: это правило перезапишет предыдущее, если есть __tmp_port

          - target_label: __metrics_path__
            replacement: /stats/prometheus

          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod