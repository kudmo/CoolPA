apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-go-app-client
  namespace: autoscale-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-go-app-client
  template:
    metadata:
      labels:
        app: test-go-app-client
    spec:
      containers:
        - name: test-go-app-client
          image: test-go-app-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
